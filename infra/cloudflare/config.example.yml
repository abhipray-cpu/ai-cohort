# Copy to a machine-local configuration file; do not commit tunnel credentials.
tunnel: REPLACE_WITH_TUNNEL_ID
credentials-file: C:/Users/REPLACE_ME/.cloudflared/REPLACE_WITH_TUNNEL_ID.json

ingress:
  - hostname: tenderlens.example.com
    service: http://127.0.0.1:8000
  - hostname: resolvedesk.example.com
    service: http://127.0.0.1:8001
  - hostname: propertybrief.example.com
    service: http://127.0.0.1:8002
  - hostname: patchdesk.example.com
    service: http://127.0.0.1:8003
  - service: http_status:404
