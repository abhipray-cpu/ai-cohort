[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cohort"
version = "0.1.0"
description = "Shared platform and AI Cohort products"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
  "semantic-version>=2.10,<3",
  "numpy>=2,<3",
  "onnxruntime>=1.20,<2",
  "tokenizers>=0.21,<1",
  "huggingface-hub>=0.30,<2",
  "httpx>=0.28,<1",
  "nats-py>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "cryptography>=44,<48",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.9,<1", "pgserver==0.1.4; sys_platform == 'darwin' or sys_platform == 'linux'"]

[tool.setuptools.packages.find]
where = ["apps/tenderlens-api/src", "apps/resolvedesk-api/src", "apps/propertybrief-api/src", "apps/patchdesk-api/src", "apps/relaydesk-api/src", "apps/clausegate-api/src", "apps/catalogbridge-api/src", "apps/buildrelay-api/src", "apps/casecouncil-api/src", "apps/shelfproof-api/src", "apps/releasefence-api/src", "packages/agent-core/src", "packages/contracts/src", "packages/observability/src"]

[tool.setuptools.package-data]
catalogbridge_api = ["classifier_instructions.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/releasefence-api/src", "apps/shelfproof-api/src", "apps/resolvedesk-api/src", "apps/propertybrief-api/src", "apps/patchdesk-api/src", "apps/relaydesk-api/src", "apps/clausegate-api/src", "apps/catalogbridge-api/src", "apps/buildrelay-api/src", "apps/casecouncil-api/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"apps/tenderlens-api/src/tenderlens_api/api.py" = ["B008"]
"apps/resolvedesk-api/src/resolvedesk_api/api.py" = ["B008"]
"apps/propertybrief-api/src/propertybrief_api/api.py" = ["B008"]
"apps/patchdesk-api/src/patchdesk_api/api.py" = ["B008"]
"apps/relaydesk-api/src/relaydesk_api/api.py" = ["B008"]
"apps/clausegate-api/src/clausegate_api/api.py" = ["B008"]
"apps/casecouncil-api/src/casecouncil_api/api.py" = ["B008"]
"apps/shelfproof-api/src/shelfproof_api/api.py" = ["B008"]
"apps/releasefence-api/src/releasefence_api/api.py" = ["B008"]
"tests/test_releasefence*.py" = ["F811"] # Explicit cross-module pytest fixture registration
