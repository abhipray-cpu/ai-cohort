[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cohort"
version = "0.1.0"
description = "Shared platform, TenderLens, ResolveDesk, and PropertyBrief products"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["apps/tenderlens-api/src", "apps/resolvedesk-api/src", "apps/propertybrief-api/src", "packages/agent-core/src", "packages/contracts/src", "packages/observability/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/resolvedesk-api/src", "apps/propertybrief-api/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"apps/tenderlens-api/src/tenderlens_api/api.py" = ["B008"]
"apps/resolvedesk-api/src/resolvedesk_api/api.py" = ["B008"]
"apps/propertybrief-api/src/propertybrief_api/api.py" = ["B008"]
