# Copy to a machine-local configuration file; do not commit tunnel credentials.
tunnel: REPLACE_WITH_TUNNEL_ID
credentials-file: C:/Users/REPLACE_ME/.cloudflared/REPLACE_WITH_TUNNEL_ID.json

ingress:
  - hostname: tenderlens.example.com
    service: http://127.0.0.1:8000
  - hostname: resolvedesk.example.com
    service: http://127.0.0.1:8001
  - hostname: propertybrief.example.com
    service: http://127.0.0.1:8002
  - hostname: patchdesk.example.com
    service: http://127.0.0.1:8003
  - hostname: relaydesk.example.com
    service: http://127.0.0.1:8004
  - hostname: clausegate.example.com
    service: http://127.0.0.1:8005
  # Configure Cloudflare Access separately; ingress alone is not authorization.
  - hostname: catalogbridge.example.com
    service: http://127.0.0.1:8006
  # Public HMAC-authenticated webhook path must bypass interactive Access login.
  # Protect all other paths with Access AND application sessions; do not expose NATS.
  - hostname: buildrelay.example.com
    service: http://127.0.0.1:8007
  # CaseCouncil has NO public webhook exception: Access must protect every path.
  - hostname: casecouncil.example.com
    service: http://127.0.0.1:8008
  # ShelfProof: protect EVERY path with Access; set SHELFPROOF_ORIGIN to the HTTPS hostname.
  # Deployment acceptance remains pending. No public webhook exception.
  - hostname: shelfproof.example.com
    service: http://127.0.0.1:8009
  - service: http_status:404
